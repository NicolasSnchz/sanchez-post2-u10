name: Android CI/CD

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  lint-test-quality:
    name: Lint, pruebas unitarias y cobertura
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin

      - name: Configurar permisos de Gradle
        run: chmod +x ./gradlew

      - name: Cache de Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Ejecutar lint
        run: ./gradlew lintDebug

      - name: Ejecutar pruebas unitarias
        run: ./gradlew testDebugUnitTest

      - name: Ejecutar quality gate de cobertura
        run: ./gradlew jacocoTestCoverageVerification

      - name: Subir reportes de pruebas
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unit-test-results
          path: app/build/reports/tests/

      - name: Subir reporte de lint
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lint-results
          path: app/build/reports/lint-results-debug.html

      - name: Subir reporte de cobertura
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: app/build/reports/jacoco/

  build-and-distribute:
    name: Build firmado y distribucion Firebase
    runs-on: ubuntu-latest
    needs: lint-test-quality
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    env:
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      KEYSTORE_PASS: ${{ secrets.KEYSTORE_PASS }}
      KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      KEY_PASS: ${{ secrets.KEY_PASS }}
      FIREBASE_APP_ID: ${{ secrets.FIREBASE_APP_ID }}
      FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin

      - name: Configurar permisos de Gradle
        run: chmod +x ./gradlew

      - name: Decodificar Keystore desde GitHub Secrets
        if: env.KEYSTORE_BASE64 != ''
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > release-key.jks
          echo "KEYSTORE_PATH=$PWD/release-key.jks" >> $GITHUB_ENV

      - name: Crear Keystore temporal si no existen secrets
        if: env.KEYSTORE_BASE64 == ''
        run: |
          keytool -genkeypair -v \
            -keystore release-key.jks \
            -alias ci-demo \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass android \
            -keypass android \
            -dname "CN=CI Demo, OU=Mobile, O=UDES, L=Cucuta, S=Norte de Santander, C=CO"
          echo "KEYSTORE_PATH=$PWD/release-key.jks" >> $GITHUB_ENV
          echo "KEYSTORE_PASS=android" >> $GITHUB_ENV
          echo "KEY_ALIAS=ci-demo" >> $GITHUB_ENV
          echo "KEY_PASS=android" >> $GITHUB_ENV

      - name: Compilar APK release firmado
        run: ./gradlew assembleRelease

      - name: Subir APK firmado como artifact
        uses: actions/upload-artifact@v4
        with:
          name: signed-release-apk
          path: app/build/outputs/apk/release/app-release.apk

      - name: Distribuir en Firebase App Distribution
        if: env.FIREBASE_APP_ID != '' && env.FIREBASE_TOKEN != ''
        uses: wzieba/Firebase-Distribution-Github-Action@v1
        with:
          appId: ${{ secrets.FIREBASE_APP_ID }}
          token: ${{ secrets.FIREBASE_TOKEN }}
          groups: testers
          file: app/build/outputs/apk/release/app-release.apk
          releaseNotes: Build ${{ github.run_number }} - ${{ github.sha }}
