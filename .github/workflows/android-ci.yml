name: Android Fastlane CD

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  lint-test:
    name: Lint y pruebas unitarias
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin

      - name: Configurar permisos de Gradle
        run: chmod +x ./gradlew

      - name: Ejecutar lint
        run: ./gradlew lintDebug

      - name: Ejecutar pruebas unitarias
        run: ./gradlew testDebugUnitTest

      - name: Ejecutar quality gate de cobertura
        run: ./gradlew jacocoTestCoverageVerification

  fastlane-beta:
    name: Fastlane beta
    runs-on: ubuntu-latest
    needs: lint-test
    if: github.ref == 'refs/heads/main'

    env:
      CI_DEMO_MODE: 'true'
      VERSION_CODE: ${{ github.run_number }}
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      KEYSTORE_PASS: ${{ secrets.KEYSTORE_PASS }}
      KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      KEY_PASS: ${{ secrets.KEY_PASS }}
      PLAY_CREDENTIALS_BASE64: ${{ secrets.PLAY_CREDENTIALS_BASE64 }}

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin

      - name: Configurar Ruby 3.2
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
          bundler-cache: true

      - name: Configurar permisos de Gradle
        run: chmod +x ./gradlew

      - name: Decodificar Keystore desde GitHub Secrets
        if: env.KEYSTORE_BASE64 != ''
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > release-key.jks
          echo "KEYSTORE_PATH=$PWD/release-key.jks" >> $GITHUB_ENV

      - name: Crear Keystore temporal para CI
        if: env.KEYSTORE_BASE64 == ''
        run: |
          keytool -genkeypair -v \
            -keystore release-key.jks \
            -alias ci-demo \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass android \
            -keypass android \
            -dname "CN=CI Demo, OU=Mobile, O=UDES, L=Cucuta, S=Norte de Santander, C=CO"
          echo "KEYSTORE_PATH=$PWD/release-key.jks" >> $GITHUB_ENV
          echo "KEYSTORE_PASS=android" >> $GITHUB_ENV
          echo "KEY_ALIAS=ci-demo" >> $GITHUB_ENV
          echo "KEY_PASS=android" >> $GITHUB_ENV

      - name: Decodificar credenciales de Play Console
        if: env.PLAY_CREDENTIALS_BASE64 != ''
        run: |
          mkdir -p fastlane
          echo "$PLAY_CREDENTIALS_BASE64" | base64 -d > fastlane/google-play-credentials.json

      - name: Listar lanes de Fastlane
        run: bundle exec fastlane lanes

      - name: Ejecutar Fastlane beta
        run: bundle exec fastlane beta
